# Free 24/7 monitoring with no server and no credit card.
#
# SETUP
#   1. Copy this file to .github/workflows/monitor.yml in your repo
#   2. Add a repository secret DISCORD_WEBHOOK_URL
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
#   3. Push. Trigger a first run by hand from the Actions tab.
#
# HOW IT WORKS
#   The shop rotates at 00:00 UTC. This job wakes at 23:50 UTC and polls in a
#   loop across the rotation, then exits. ~45 min/day.
#
#   GitHub's cron is best-effort and can start late under load. That matters
#   much less than it looks: the upstream API is behind a 30-minute cache, so
#   fresh shop data does not exist at 00:00 anyway. A late start mostly eats
#   into slack, not into detection.
#
# STATE
#   State is committed back to the repo rather than kept in actions/cache.
#   Two reasons: caches can be evicted, and - more importantly - GitHub
#   auto-disables scheduled workflows on repos with no activity for 60 days.
#   A daily state commit keeps the repo active, so the schedule never dies.
#   The 1.3 MB cosmetics catalog stays in actions/cache since it is
#   regenerable and would bloat the repo.

name: Fortnite Shop Monitor

on:
  schedule:
    - cron: "50 23 * * *"   # 23:50 UTC daily, just before the rotation
  workflow_dispatch:         # manual trigger, for testing

concurrency:
  group: fortnite-shop-monitor
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit state back

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Catalog only - regenerable, so cache is the right home for it.
      - name: Restore cosmetics catalog
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: fnshop-catalog-${{ github.run_id }}
          restore-keys: fnshop-catalog-

      - name: Watch across the shop rotation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END=$(( $(date +%s) + 45*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            # A failed poll must not fail the job - the next one may succeed.
            python run.py --once || echo "poll failed, continuing"
            sleep 20
          done

      - name: Save cosmetics catalog
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: fnshop-catalog-${{ github.run_id }}

      # state/ is gitignored for local development, so force-add it here.
      - name: Persist state
        if: always()
        run: |
          git config user.name  "fortnite-shop-monitor"
          git config user.email "actions@github.com"
          git add -f state/state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update shop state [skip ci]"
            # Another run could have pushed meanwhile; rebase rather than fail.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
