# Free 24/7 monitoring with no server and no credit card.
#
# SETUP
#   1. Copy this file to .github/workflows/monitor.yml in your repo
#   2. Add a repository secret DISCORD_WEBHOOK_URL
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
#   3. Settings -> Actions -> General -> Workflow permissions
#      -> "Read and write permissions"  (needed to commit state back)
#
# HOW IT WORKS
#   The shop rotates at 00:00 UTC. This job wakes at 23:50 UTC and polls in a
#   loop across the rotation, then exits. ~45 min/day.
#
#   GitHub's cron is best-effort and can start late under load. That matters
#   much less than it looks: the upstream API is behind a 30-minute cache, so
#   fresh shop data does not exist at 00:00 anyway.
#
# FAILING LOUDLY
#   A monitor that dies quietly is worse than no monitor. Individual polls are
#   allowed to fail (the next one may succeed), but if EVERY poll fails, or
#   the webhook secret is missing, the job fails so GitHub emails you. Do not
#   "fix" that by making these steps forgiving again.
#
# STATE
#   State is committed back to the repo rather than kept in actions/cache.
#   Caches can be evicted, and GitHub auto-disables scheduled workflows on
#   repos with no activity for 60 days - a daily state commit prevents both.
#   The 1.3 MB cosmetics catalog stays in actions/cache since it is
#   regenerable and would bloat the repo.

name: Fortnite Shop Monitor

on:
  schedule:
    - cron: "50 23 * * *"   # 23:50 UTC daily, just before the rotation
  workflow_dispatch:         # manual trigger, for testing

concurrency:
  group: fortnite-shop-monitor
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit state back

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fail immediately rather than "succeeding" while silently unable to
      # notify anyone.
      - name: Check notification channel is configured
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::No DISCORD_WEBHOOK_URL or TELEGRAM_BOT_TOKEN secret is set."
            exit 1
          fi
          echo "Notification channel configured."

      # Prove the runner can actually reach the API before burning 45 minutes.
      # Cloudflare sometimes challenges datacenter IPs, which would otherwise
      # look like a silent no-op.
      - name: Verify API reachability
        run: |
          CODE=$(curl -s -o /tmp/shop.json -w '%{http_code}' --compressed \
                   -H 'Accept: application/json' \
                   "https://fortnite-api.com/v2/shop?language=en")
          echo "HTTP $CODE, $(wc -c < /tmp/shop.json) bytes"
          if [ "$CODE" != "200" ]; then
            echo "::error::API returned HTTP $CODE from this runner."
            head -c 500 /tmp/shop.json
            exit 1
          fi

      - name: Restore cosmetics catalog
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: fnshop-catalog-${{ github.run_id }}
          restore-keys: fnshop-catalog-

      # Which watched items were already in the shop before this run, so the
      # commit message below can tell a fresh drop from one that was already
      # sitting there yesterday.
      - name: Snapshot state before the run
        run: |
          cp state/state.json /tmp/state-before.json 2>/dev/null || true

      - name: Watch across the shop rotation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OK=0
          FAILED=0
          END=$(( $(date +%s) + 45*60 ))

          while [ "$(date +%s)" -lt "$END" ]; do
            # One bad poll must not abort the run - but we count it.
            if python run.py --once; then
              OK=$(( OK + 1 ))
            else
              FAILED=$(( FAILED + 1 ))
            fi
            sleep 20
          done

          echo "Polls: $OK succeeded, $FAILED failed."
          {
            echo "### Poll summary"
            echo ""
            echo "- succeeded: **$OK**"
            echo "- failed: **$FAILED**"
          } >> "$GITHUB_STEP_SUMMARY"

          # A run where nothing ever worked must not report success.
          if [ "$OK" -eq 0 ]; then
            echo "::error::Every poll failed - the monitor did not work this run."
            exit 1
          fi

      - name: Save cosmetics catalog
        if: always()
        uses: actions/cache/save@v5
        with:
          path: cache
          key: fnshop-catalog-${{ github.run_id }}

      # state/ is gitignored for local development, so force-add it here.
      #
      # The commit message names any watched item that appeared, so `git log`
      # doubles as a searchable drop history:
      #
      #   alert: Son Goku in the shop [skip ci]        <- appeared this run
      #   chore: Son Goku still in the shop [skip ci]  <- was already there
      #   chore: update shop state [skip ci]           <- nothing watched in shop
      #
      # This runs AFTER the polling loop has exited, so it cannot delay or
      # block a notification - the Discord alert already went out above.
      - name: Persist state
        if: always()
        run: |
          git config user.name  "fortnite-shop-monitor"
          git config user.email "actions@github.com"
          git add -f state/state.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No state change to commit."
            echo "State unchanged this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MSG=$(python - <<'PY'
          import json, pathlib, sys

          # Reuse the app's own name normalisation so the keys line up exactly.
          sys.path.insert(0, ".")
          try:
              from src.matcher import normalize_name
          except Exception:
              def normalize_name(name):
                  return (name or "").strip().casefold()

          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          before = load("/tmp/state-before.json")
          after = load("state/state.json")

          # Map internal item keys back to the names as written in watchlist.json.
          labels = {}
          for raw in load("watchlist.json").get("items", []):
              if isinstance(raw, str):
                  labels["name:" + normalize_name(raw)] = raw.strip()
              elif isinstance(raw, dict):
                  shown = (raw.get("name") or raw.get("id") or "").strip()
                  if raw.get("id"):
                      labels[raw["id"].casefold()] = shown
                  if raw.get("name"):
                      labels["name:" + normalize_name(raw["name"])] = shown

          def label(key):
              return labels.get(key.casefold()) or key.replace("name:", "", 1)

          prev = set(before.get("present_keys") or [])
          now = set(after.get("present_keys") or [])

          # With no baseline every item would look new, so don't claim a drop.
          appeared = sorted(now - prev) if before.get("seeded") else []

          if appeared:
              prefix, keys, verb = "alert", appeared, "in the shop"
          elif now:
              prefix, keys, verb = "chore", sorted(now), "still in the shop"
          else:
              prefix = None

          if prefix is None:
              print("chore: update shop state [skip ci]")
          else:
              # Order by the name you would recognise, not by internal item ID,
              # so the truncated "+N more" keeps a predictable three.
              names = sorted(label(k) for k in keys)
              shown = names[:3]
              extra = len(names) - len(shown)
              listed = ", ".join(shown) + (" +%d more" % extra if extra else "")
              print("%s: %s %s [skip ci]" % (prefix, listed, verb))
          PY
          ) || true   # -e would otherwise abort before the fallback below

          # A broken message generator must never stop state from persisting.
          if [ -z "$MSG" ]; then
            MSG="chore: update shop state [skip ci]"
          fi

          git commit -m "$MSG"
          # Another run could have pushed meanwhile; rebase rather than fail.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "State committed and pushed as: \`$MSG\`" >> "$GITHUB_STEP_SUMMARY"
